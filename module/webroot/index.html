<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenP2P</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --fg:#1a1c20; --dim:#6b7280;
    --line:#e5e7eb; --field:#f7f8fa;
    --acc:#4f6ef7; --acc-fg:#ffffff;
    --on:#22c55e; --off:#c3c7ce;
    --ok-fg:#15803d; --ok-bg:#e9f9ef; --ok-bd:#bfe8d0;
    --bad-fg:#dc2626; --bad-bg:#fdecec; --bad-bd:#f5c8c8;
    --alt-fg:#4f6ef7; --alt-bg:#eef1fe; --alt-bd:#d6defd;
    --code-bg:#f6f7f9; --code-fg:#31343a;
    --warn:#d97706;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1012; --card:#1a1c20; --fg:#e8eaed; --dim:#9aa0a6;
      --line:#2a2d33; --field:#14161a;
      --acc:#5b78ff; --acc-fg:#ffffff;
      --on:#34d399; --off:#4b5058;
      --ok-fg:#34d399; --ok-bg:rgba(52,211,153,.12); --ok-bd:rgba(52,211,153,.30);
      --bad-fg:#f87171; --bad-bg:rgba(248,113,113,.12); --bad-bd:rgba(248,113,113,.28);
      --alt-fg:#8fa2ff; --alt-bg:rgba(91,120,255,.14); --alt-bd:rgba(91,120,255,.30);
      --code-bg:#0b0c0e; --code-fg:#c8ccd2;
      --warn:#fbbf24;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--fg);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  }
  .wrap{max-width:560px;margin:0 auto}

  header{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 14px}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
  .ver{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
        box-shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.03)}

  .top{display:flex;align-items:center;justify-content:space-between}
  .state{display:flex;align-items:center;min-width:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--off);margin-right:9px;flex:none}
  .dot.on{background:var(--on);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
  .state b{font-size:15px;font-weight:600}
  .auto{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}

  .sw{position:relative;display:inline-block;width:44px;height:25px;flex:none}
  .sw input{position:absolute;width:0;height:0;opacity:0}
  .sw i{position:absolute;inset:0;background:var(--off);border-radius:999px;transition:background .18s}
  .sw i::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;
               background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
  .sw input:checked + i{background:var(--on)}
  .sw input:checked + i::after{transform:translateX(19px)}
  .sw input:disabled + i{opacity:.45}

  .node{margin:10px 0 2px;font-size:17px;font-weight:600;letter-spacing:.2px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node.dim{color:var(--dim);font-weight:500}
  .meta{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.2px;min-height:1px}

  /* 网络信息：点一下复制 */
  .net{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .cell{position:relative;display:block;text-align:left;padding:9px 20px 9px 10px;border:0;
        border-radius:11px;background:var(--field);color:var(--fg);
        font-family:inherit;cursor:pointer;transition:opacity .12s}
  .cell:active{opacity:.6}
  .cell.wide{grid-column:1 / -1}
  .cell .k{display:block;font-size:11px;color:var(--dim);letter-spacing:.2px}
  .cell .v{display:block;margin-top:1px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;
           overflow-wrap:anywhere}
  .cell.empty .v{color:var(--dim)}
  .cp{position:absolute;right:8px;top:8px;color:var(--dim);opacity:.55}
  .cell.empty .cp{display:none}

  .btns{display:flex;gap:8px;margin-top:14px}
  .btn{
    flex:1 1 0;min-width:0;height:44px;padding:0 10px;
    border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);
    font-size:14px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:opacity .15s,transform .06s;font-family:inherit;
  }
  .btn:active{transform:scale(.985)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
  .btn.start{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-fg)}
  .btn.stop{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-fg)}
  .btn.restart{background:var(--alt-bg);border-color:var(--alt-bd);color:var(--alt-fg)}

  /* token */
  .tkrow{display:flex;gap:8px}
  .tkin{position:relative;flex:1 1 auto;min-width:0;display:flex}
  input{
    flex:1 1 auto;min-width:0;height:46px;padding:0 44px 0 13px;border-radius:12px;
    border:1px solid var(--line);background:var(--field);color:var(--fg);
    font:15px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4px;
    outline:none;-webkit-appearance:none;
  }
  input[type=password]{letter-spacing:2px}
  input:focus{border-color:var(--acc)}
  input::placeholder{color:var(--dim);font-family:system-ui,sans-serif;letter-spacing:0}
  .tkrow .btn{flex:none;width:80px;height:46px}
  .eye{position:absolute;right:2px;top:2px;width:40px;height:42px;border:0;background:transparent;
       color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .eye .e2{display:none}
  .eye.on .e1{display:none}
  .eye.on .e2{display:block}

  /* 管理页 */
  .linkbtn{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;border:0;
           background:var(--card);border-radius:16px;color:var(--fg);text-align:left;
           font:600 15px/1 inherit;font-family:inherit;cursor:pointer;
           margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.03)}
  .linkbtn:active{opacity:.75}
  .linkbtn .lbl{flex:1}
  .linkbtn .chev{color:var(--alt-fg);font-size:15px;line-height:1;display:inline-block}

  .ico{width:30px;height:30px;border-radius:9px;flex:none;
       display:flex;align-items:center;justify-content:center;
       background:var(--field);color:var(--dim)}
  .ico.acc{background:var(--alt-bg);color:var(--alt-fg)}

  .list{padding:2px 16px}
  .rowbtn{display:flex;align-items:center;gap:11px;width:100%;height:52px;
          padding:0;border:0;background:none;color:var(--fg);
          font:500 14.5px/1 inherit;font-family:inherit;cursor:pointer;text-align:left}
  .rowbtn .lbl{flex:1}
  .rowbtn .chev{color:var(--dim);font-size:15px;line-height:1;display:inline-block;
                transition:transform .15s}
  .rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}

  .preview{margin:-2px 0 12px;padding-left:41px;
           font:11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .preview.empty{font-family:system-ui,sans-serif;font-size:12px}

  .logwrap{padding:0 0 14px}
  .tools{display:flex;gap:2px;margin:-2px -6px 8px;padding-left:41px}
  .mini{border:0;background:transparent;color:var(--acc);font:13px/1 inherit;font-family:inherit;
        padding:6px;cursor:pointer}
  .mini[disabled]{opacity:.4;pointer-events:none}
  pre{
    margin:0;padding:12px;border-radius:11px;background:var(--code-bg);color:var(--code-fg);
    font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;
    max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  pre.empty{color:var(--dim)}

  .busy{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
        background:var(--card);border-top:1px solid var(--line);font-size:13px;color:var(--dim);
        text-align:center;transform:translateY(100%);transition:transform .2s}
  .busy.show{transform:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OpenP2P</h1>
    <span class="ver" id="ver"></span>
  </header>

  <section class="card">
    <div class="top">
      <div class="state"><i class="dot" id="dot"></i><b id="runText">读取中</b></div>
      <label class="auto">开机自启
        <span class="sw"><input type="checkbox" id="auto"><i></i></span>
      </label>
    </div>
    <div class="node dim" id="node">—</div>
    <div class="meta" id="meta"></div>

    <div class="net">
      <button class="cell" id="c-lan" type="button">
        <span class="k">内网 IP</span><span class="v">—</span>
        <svg class="cp" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
      </button>
      <button class="cell" id="c-pub4" type="button">
        <span class="k">公网 IPv4</span><span class="v">—</span>
        <svg class="cp" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
      </button>
      <button class="cell wide" id="c-pub6" type="button">
        <span class="k">IPv6</span><span class="v">—</span>
        <svg class="cp" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
      </button>
    </div>

    <div class="btns">
      <button class="btn start" id="start">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
        <span>启动</span>
      </button>
      <button class="btn stop" id="stop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.4"/></svg>
        <span>停止</span>
      </button>
      <button class="btn restart" id="restart">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11a8.5 8.5 0 1 0-2.5 6.4"/><path d="M20.5 4.5V11H14"/></svg>
        <span>重启</span>
      </button>
    </div>
  </section>

  <section class="card tkrow">
    <span class="tkin">
      <input id="tk" type="password" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="token">
      <button class="eye" id="eye" type="button" aria-label="显示 token">
        <svg class="e1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="3.1"/></svg>
        <svg class="e2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="3.1"/><path d="M4 4l16 16"/></svg>
      </button>
    </span>
    <button class="btn primary" id="save">保存</button>
  </section>

  <button class="linkbtn" id="mgmt" type="button">
    <span class="ico acc">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.8"/><path d="M3.2 12h17.6"/><path d="M12 3.2c2.6 3.1 2.6 14.5 0 17.6-2.6-3.1-2.6-14.5 0-17.6z"/></svg>
    </span>
    <span class="lbl">管理页</span>
    <span class="chev">↗</span>
  </button>

  <section class="card list">
    <button class="rowbtn" id="logtoggle" aria-expanded="false" aria-controls="logwrap">
      <span class="ico">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="4.2" width="18.4" height="15.6" rx="3"/><path d="M7.2 10l2.6 2.4-2.6 2.4"/><path d="M12.6 15h4.2"/></svg>
      </span>
      <span class="lbl">运行日志</span>
      <span class="chev">›</span>
    </button>
    <div class="preview" id="preview" hidden></div>
    <div class="logwrap" id="logwrap" hidden>
      <div class="tools">
        <button class="mini" id="reload">刷新</button>
        <button class="mini" id="clear">清空</button>
        <button class="mini" id="diag">诊断</button>
        <button class="mini" id="export">导出</button>
      </div>
      <pre id="log" class="empty"></pre>
    </div>
  </section>
</div>

<div class="busy" id="busy"></div>

<script>
(function () {
  'use strict';

  var O2P_PATHS = ['/data/adb/openp2p/o2p',
                   '/data/adb/modules/openp2p/o2p',
                   '/data/adb/modules_update/openp2p/o2p'];
  var MGMT = 'https://console.openp2p.cn';
  // 状态读失败时用来定位：脚本在不在、进程在不在
  var PROBE = 'for d in ' + O2P_PATHS.join(' ') +
    '; do if [ -e "$d" ]; then echo "存在 $d"; else echo "缺失 $d"; fi; done; ' +
    'echo "客户端 pid: $(pidof openp2p)"; echo "id: $(id -u)"';
  var seq = 0;

  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), runText = $('runText'), ver = $('ver'), node = $('node'),
      meta = $('meta'), logEl = $('log'), tk = $('tk'), busy = $('busy'), autoEl = $('auto'),
      logWrap = $('logwrap'), logToggle = $('logtoggle'), preview = $('preview');

  var isOn = false, logOpen = false, lastLine = '';

  function hasKsu() {
    return typeof window.ksu !== 'undefined' && typeof window.ksu.exec === 'function';
  }

  // ksu.exec 的回调形式：ksu.exec(cmd, optionsJson, 全局回调名)，回调 (code, stdout, stderr)
  // 老管理器只有两参 exec(cmd, 回调名)，退回去再试一次；再不行就超时兜底
  function sh(cmd) {
    return new Promise(function (resolve) {
      if (!hasKsu()) {
        resolve({ code: -1, out: '请从 KernelSU 管理器的模块页「打开」进入此界面', err: '' });
        return;
      }
      var name = '__o2p_cb_' + (++seq);
      var done = false;
      var timer = setTimeout(function () { finish({ code: -1, out: '执行超时', err: '' }); }, 20000);

      function finish(r) {
        if (done) { return; }
        done = true;
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        resolve(r);
      }

      window[name] = function (code, out, err) {
        // 不同管理器给的 code 可能是字符串、输出可能是行数组，统一成数字和字符串
        var c = (typeof code === 'number') ? code : parseInt(code, 10);
        if (isNaN(c)) { c = -1; }
        if (Object.prototype.toString.call(out) === '[object Array]') { out = out.join('\n'); }
        if (Object.prototype.toString.call(err) === '[object Array]') { err = err.join('\n'); }
        finish({ code: c, out: out || '', err: err || '' });
      };

      try {
        window.ksu.exec(cmd, '{}', name);
      } catch (e) {
        try {
          window.ksu.exec(cmd, name);
        } catch (e2) {
          finish({ code: -1, out: String(e2), err: '' });
        }
      }
    });
  }

  // /data/adb/openp2p/o2p 是指向模块目录的软链，安装后若指向 modules_update，
  // 重启后那条路径就没了（断链）。所以逐个探测，挑第一个真实存在的。
  // 用变量 + 普通调用，不用 exec：有些管理器的 shell 在 for 里 exec 之后行为不一致
  function o2p(sub) {
    var probe = 'D=; for d in ' + O2P_PATHS.join(' ') +
      '; do if [ -f "$d" ]; then D="$d"; break; fi; done; ' +
      'if [ -z "$D" ]; then echo "找不到 o2p 脚本，模块可能没装好或软链断了" >&2; exit 127; fi; ' +
      '/system/bin/sh "$D" ' + sub;
    return sh(probe);
  }

  function toast(msg) {
    try { if (window.ksu && window.ksu.toast) { window.ksu.toast(msg); return; } } catch (e) {}
    showBusy(msg, 1600);
  }

  function showBusy(text, ms) {
    if (!text) { busy.className = 'busy'; return; }
    busy.textContent = text;
    busy.className = 'busy show';
    if (ms) { setTimeout(function () { busy.className = 'busy'; }, ms); }
  }

  function parseState(s) {
    var o = {};
    s.split('\n').forEach(function (line) {
      var i = line.indexOf('=');
      if (i > 0) { o[line.slice(0, i).trim()] = line.slice(i + 1).trim(); }
    });
    return o;
  }

  // 点一下复制。WebUI 是 https 源，clipboard API 一般可用；不行就退回 textarea
  function copy(text) {
    if (!text) { return; }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? '已复制' : '复制失败');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, legacy);
    } else {
      legacy();
    }
  }

  function setCell(id, v) {
    var el = $(id);
    var val = (v && v !== 'undefined' && v !== 'null') ? v : '';
    el.dataset.v = val;
    el.querySelector('.v').textContent = val || '—';
    el.classList.toggle('empty', !val);
  }

  function setPreview(text) {
    lastLine = (text || '').trim();
    if (logOpen) { preview.hidden = true; return; }
    preview.hidden = false;
    preview.textContent = lastLine || '还没有日志';
    preview.classList.toggle('empty', !lastLine);
  }

  function render(s) {
    isOn = s.run === '1';
    dot.className = 'dot' + (isOn ? ' on' : '');
    runText.textContent = isOn ? '运行中' : '未运行';
    ver.textContent = s.ver ? 'v' + s.ver : '';

    node.textContent = s.node || '未命名';
    node.className = 'node' + (s.node ? '' : ' dim');
    node.title = s.node || '';

    setCell('c-lan', s.lan);
    setCell('c-pub4', s.pub4);
    setCell('c-pub6', s.pub6);

    meta.textContent = s.sb ? '共享 ' + s.sb + ' Mbps' : '';

    var set = s.token && s.token !== '0';
    tk.placeholder = set ? 'token 已配置' : 'token';

    setPreview(s.last);
    autoEl.checked = s.autostart !== '0';
    syncActions();
  }

  // 当前状态做不了的动作置灰，不用文字解释
  function syncActions() {
    if (running) { return; }
    $('start').disabled = isOn;
    $('stop').disabled = !isOn;
  }

  function setLocked(v) {
    ['save', 'start', 'stop', 'restart', 'reload', 'clear', 'diag', 'export', 'auto'].forEach(function (id) {
      $(id).disabled = v;
    });
    if (!v) { syncActions(); }
  }

  var loading = false;
  function refresh() {
    if (loading) { return Promise.resolve(false); }
    loading = true;
    return o2p('state').then(function (r) {
      loading = false;
      if (r.code !== 0) {
        isOn = false;
        runText.textContent = '读取失败';
        syncActions();
        var why = ((r.out || '') + '\n' + (r.err || '')).replace(/\r/g, '').trim();
        // 状态读不出来时顺手探一下环境，省得来回猜
        return sh(PROBE).then(function (p) {
          var extra = ((p.out || '') + (p.err || '')).replace(/\r/g, '').trim();
          openLog();
          logEl.className = '';
          logEl.textContent = '状态读取失败（退出码 ' + r.code + '）\n' +
            (why ? why + '\n\n' : '') + '—— 环境探测 ——\n' + (extra || '（探测器也没有输出，可能 root 权限没给到 WebUI）');
          return false;
        });
      }
      render(parseState(r.out));
      return true;
    });
  }

  function loadLog() {
    logEl.className = 'empty';
    logEl.textContent = '读取中…';
    return o2p('log 200').then(function (r) {
      var text = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      logEl.className = text ? '' : 'empty';
      logEl.textContent = text || '暂无日志';
      logEl.scrollTop = logEl.scrollHeight;
    });
  }

  function openLog() {
    logOpen = true;
    logWrap.hidden = false;
    preview.hidden = true;
    logToggle.setAttribute('aria-expanded', 'true');
  }

  function toggleLog() {
    logOpen = !logOpen;
    logWrap.hidden = !logOpen;
    logToggle.setAttribute('aria-expanded', logOpen ? 'true' : 'false');
    if (logOpen) {
      preview.hidden = true;
      loadLog();
    } else {
      setPreview(lastLine);
    }
  }

  var running = false;
  // 每步操作后刷状态；日志开着就跟着刷，关着就不打扰
  function act(sub, label) {
    if (running) { return Promise.resolve(); }
    running = true;
    setLocked(true);
    showBusy(label);
    return o2p(sub).then(function (r) {
      var out = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      return refresh().then(function () {
        running = false;
        setLocked(false);
        showBusy('');
        if (r.code === 0) {
          toast(out.split('\n').pop() || label + '完成');
          if (logOpen) { loadLog(); }
          return;
        }
        openLog();
        logEl.className = '';
        logEl.textContent = out || (label + '失败（退出码 ' + r.code + '）');
      });
    });
  }

  logToggle.addEventListener('click', toggleLog);
  preview.addEventListener('click', toggleLog);

  ['c-lan', 'c-pub4', 'c-pub6'].forEach(function (id) {
    $(id).addEventListener('click', function () { copy(this.dataset.v); });
  });

  $('eye').addEventListener('click', function () {
    var show = tk.type === 'password';
    tk.type = show ? 'text' : 'password';
    $('eye').classList.toggle('on', show);
    tk.focus();
  });

  $('save').addEventListener('click', function () {
    var v = tk.value.trim();
    if (!v) { toast('先填 token'); tk.focus(); return; }
    if (!/^\d+$/.test(v)) { toast('token 是纯数字'); return; }
    act('token ' + v, '保存').then(function () { tk.value = ''; });
  });

  $('start').addEventListener('click', function () { act('start', '启动中'); });
  $('stop').addEventListener('click', function () { act('stop', '停止中'); });
  $('restart').addEventListener('click', function () { act('restart', '重启中'); });
  $('reload').addEventListener('click', loadLog);

  // 开机自启：只改标记文件，不需要重启进程
  autoEl.addEventListener('change', function () {
    var on = autoEl.checked;
    if (running) { autoEl.checked = !on; return; }
    act('autostart ' + (on ? 'on' : 'off'), '保存设置');
  });

  $('clear').addEventListener('click', function () { act('clearlog', '清空中'); });

  // 诊断：环境、进程、DNS、最近日志一次性打出来
  $('diag').addEventListener('click', function () {
    if (running) { return; }
    running = true;
    setLocked(true);
    openLog();
    showBusy('诊断中');
    o2p('diag').then(function (r) {
      running = false;
      setLocked(false);
      showBusy('');
      var text = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      logEl.className = text ? '' : 'empty';
      logEl.textContent = text || '诊断没有输出（退出码 ' + r.code + '）';
      logEl.scrollTop = 0;
    });
  });

  // 导出：写到 /sdcard/Download，路径用 toast 告诉用户
  $('export').addEventListener('click', function () {
    if (running) { return; }
    running = true;
    setLocked(true);
    openLog();
    showBusy('导出中');
    o2p('export').then(function (r) {
      running = false;
      setLocked(false);
      showBusy('');
      var text = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      toast(text.split('\n').pop() || ('导出失败（退出码 ' + r.code + '）'));
      logEl.className = text ? '' : 'empty';
      logEl.textContent = text || '导出没有输出（退出码 ' + r.code + '）';
      logEl.scrollTop = 0;
    });
  });

  $('mgmt').addEventListener('click', function () {
    // ksu_download 暴露 openExternal（系统浏览器打开）；老版本管理器退回 am start
    try {
      if (window.ksu_download && window.ksu_download.openExternal) {
        window.ksu_download.openExternal(MGMT);
        return;
      }
    } catch (e) {}
    sh('/system/bin/am start --user 0 -a android.intent.action.VIEW -d "' + MGMT + '"').then(function (r) {
      if (r.code !== 0) { toast('打不开浏览器：' + (r.err || r.out || r.code)); }
    });
  });

  // 从别的应用切回来时刷一次，代替一个「刷新」按钮
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { refresh(); }
  });

  refresh();
})();
</script>
</body>
</html>

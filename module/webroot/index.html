<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenP2P</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --fg:#1a1c20; --dim:#6b7280;
    --line:#e5e7eb; --field:#f9fafb;
    --acc:#4f6ef7; --acc-fg:#ffffff;
    --on:#22c55e; --off:#9ca3af;
    --code-bg:#f6f7f9; --code-fg:#31343a;
    --warn:#f59e0b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1012; --card:#1a1c20; --fg:#e8eaed; --dim:#9aa0a6;
      --line:#2a2d33; --field:#14161a;
      --acc:#5b78ff; --acc-fg:#ffffff;
      --on:#34d399; --off:#5f6368;
      --code-bg:#0b0c0e; --code-fg:#c8ccd2;
      --warn:#fbbf24;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--fg);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  }
  .wrap{max-width:560px;margin:0 auto}

  header{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 14px}
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
  .ver{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
        box-shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.03)}

  .stat{display:flex;align-items:center;margin-bottom:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--off);margin-right:9px;flex:none}
  .dot.on{background:var(--on);box-shadow:0 0 0 4px color-mix(in srgb,var(--on) 18%,transparent)}
  .stat b{font-size:16px;font-weight:600}
  .stat span{font-size:12px;color:var(--dim);margin-left:8px}

  .rows{border-top:1px solid var(--line);padding-top:12px}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px}
  .row .k{color:var(--dim);flex:none;margin-right:12px}
  .row .v{text-align:right;word-break:break-all;min-width:0;font-variant-numeric:tabular-nums}
  .row.mid{align-items:center}
  .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .v.warn{color:var(--warn)}

  .sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}
  .sw input{position:absolute;width:0;height:0;opacity:0}
  .sw i{position:absolute;inset:0;background:var(--off);border-radius:999px;transition:background .18s}
  .sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;
               background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
  .sw input:checked + i{background:var(--on)}
  .sw input:checked + i::after{transform:translateX(20px)}
  .sw input:disabled + i{opacity:.45}

  label{display:block;font-size:12px;color:var(--dim);margin-bottom:7px}
  input{
    width:100%;height:46px;padding:0 13px;border-radius:12px;
    border:1px solid var(--line);background:var(--field);color:var(--fg);
    font:15px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4px;
    outline:none;-webkit-appearance:none;
  }
  input:focus{border-color:var(--acc)}
  input::placeholder{color:var(--dim);font-family:system-ui,sans-serif;letter-spacing:0}

  .btns{display:flex;flex-wrap:wrap;margin:12px -5px -10px}
  .btn{
    flex:1 1 0;min-width:88px;height:44px;margin:0 5px 10px;padding:0 12px;
    border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);
    font-size:14px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .15s,transform .06s;
  }
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
  .btn.wide{flex:1 1 100%}

  .hint{font-size:12px;color:var(--dim);margin:10px 2px 0;line-height:1.6}

  .loghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .loghead h2{margin:0;font-size:13px;font-weight:600;color:var(--dim)}
  .mini{border:0;background:transparent;color:var(--acc);font-size:13px;padding:4px 6px;cursor:pointer}
  pre{
    margin:0;padding:12px;border-radius:12px;background:var(--code-bg);color:var(--code-fg);
    font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;
    max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  pre.empty{color:var(--dim)}

  .busy{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
        background:var(--card);border-top:1px solid var(--line);font-size:13px;color:var(--dim);
        text-align:center;transform:translateY(100%);transition:transform .2s}
  .busy.show{transform:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OpenP2P</h1>
    <span class="ver" id="ver"></span>
  </header>

  <div class="card">
    <div class="stat">
      <i class="dot" id="dot"></i>
      <b id="runText">读取中</b>
      <span id="rules"></span>
    </div>
    <div class="rows">
      <div class="row"><span class="k">节点名</span><span class="v mono" id="node">—</span></div>
      <div class="row"><span class="k">Token</span><span class="v mono" id="token">—</span></div>
      <div class="row"><span class="k">共享带宽</span><span class="v" id="sb">—</span></div>
      <div class="row"><span class="k">进程号</span><span class="v mono" id="pid">—</span></div>
      <div class="row mid"><span class="k">开机自启</span>
        <label class="sw"><input type="checkbox" id="auto"><i></i></label>
      </div>
    </div>
  </div>

  <div class="card">
    <label for="tk">Token（控制台「我的」页面里的数字）</label>
    <input id="tk" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
           placeholder="粘贴 token，留空则不修改">
    <div class="btns">
      <button class="btn primary wide" id="save">保存并启动</button>
    </div>
    <div class="btns">
      <button class="btn" id="start">启动</button>
      <button class="btn" id="stop">停止</button>
      <button class="btn" id="restart">重启</button>
    </div>
  </div>

  <div class="card">
    <div class="btns" style="margin:0 -5px -10px">
      <button class="btn primary" id="mgmt">打开管理页</button>
      <button class="btn" id="refresh">刷新状态</button>
    </div>
    <p class="hint">转发规则在 console.openp2p.cn 网页端按节点配置，客户端登录后自动下发。修改节点名要用命令行：<code>su -c o2p node &lt;名字&gt;</code></p>
  </div>

  <div class="card">
    <div class="loghead">
      <h2>运行日志</h2>
      <span>
        <button class="mini" id="diag">诊断</button>
        <button class="mini" id="export">导出</button>
        <button class="mini" id="reload">刷新</button>
      </span>
    </div>
    <pre id="log" class="empty">点「刷新」读取</pre>
  </div>
</div>

<div class="busy" id="busy"></div>

<script>
(function () {
  'use strict';

  var O2P_PATHS = ['/data/adb/openp2p/o2p',
                   '/data/adb/modules/openp2p/o2p',
                   '/data/adb/modules_update/openp2p/o2p'];
  var MGMT = 'https://console.openp2p.cn';
  // 状态读失败时用来定位：脚本在不在、进程在不在
  var PROBE = 'for d in ' + O2P_PATHS.join(' ') +
    '; do if [ -e "$d" ]; then echo "存在 $d"; else echo "缺失 $d"; fi; done; ' +
    'echo "客户端 pid: $(pidof openp2p)"; echo "id: $(id -u)"';
  var seq = 0;

  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), runText = $('runText'), ver = $('ver'), node = $('node'),
      token = $('token'), sb = $('sb'), pid = $('pid'), rules = $('rules'),
      logEl = $('log'), tk = $('tk'), busy = $('busy'), autoEl = $('auto');

  function hasKsu() {
    return typeof window.ksu !== 'undefined' && typeof window.ksu.exec === 'function';
  }

  // ksu.exec 的回调形式：ksu.exec(cmd, optionsJson, 全局回调名)，回调 (code, stdout, stderr)
  // 老管理器只有两参 exec(cmd, 回调名)，退回去再试一次；再不行就超时兜底
  function sh(cmd) {
    return new Promise(function (resolve) {
      if (!hasKsu()) {
        resolve({ code: -1, out: '请从 KernelSU 管理器的模块页「打开」进入此界面', err: '' });
        return;
      }
      var name = '__o2p_cb_' + (++seq);
      var done = false;
      var timer = setTimeout(function () { finish({ code: -1, out: '执行超时', err: '' }); }, 20000);

      function finish(r) {
        if (done) { return; }
        done = true;
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        resolve(r);
      }

      window[name] = function (code, out, err) {
        // 不同管理器给的 code 可能是字符串、输出可能是行数组，统一成数字和字符串
        var c = (typeof code === 'number') ? code : parseInt(code, 10);
        if (isNaN(c)) { c = -1; }
        if (Object.prototype.toString.call(out) === '[object Array]') { out = out.join('\n'); }
        if (Object.prototype.toString.call(err) === '[object Array]') { err = err.join('\n'); }
        finish({ code: c, out: out || '', err: err || '' });
      };

      try {
        window.ksu.exec(cmd, '{}', name);
      } catch (e) {
        try {
          window.ksu.exec(cmd, name);
        } catch (e2) {
          finish({ code: -1, out: String(e2), err: '' });
        }
      }
    });
  }

  // /data/adb/openp2p/o2p 是指向模块目录的软链，安装后若指向 modules_update，
  // 重启后那条路径就没了（断链）。所以逐个探测，挑第一个真实存在的。
  // 用变量 + 普通调用，不用 exec：有些管理器的 shell 在 for 里 exec 之后行为不一致
  function o2p(sub) {
    var probe = 'D=; for d in ' + O2P_PATHS.join(' ') +
      '; do if [ -f "$d" ]; then D="$d"; break; fi; done; ' +
      'if [ -z "$D" ]; then echo "找不到 o2p 脚本，模块可能没装好或软链断了" >&2; exit 127; fi; ' +
      '/system/bin/sh "$D" ' + sub;
    return sh(probe);
  }

  function toast(msg) {
    try { if (window.ksu && window.ksu.toast) { window.ksu.toast(msg); return; } } catch (e) {}
    showBusy(msg, 1600);
  }

  function showBusy(text, ms) {
    if (!text) { busy.className = 'busy'; return; }
    busy.textContent = text;
    busy.className = 'busy show';
    if (ms) { setTimeout(function () { busy.className = 'busy'; }, ms); }
  }

  function parseState(s) {
    var o = {};
    s.split('\n').forEach(function (line) {
      var i = line.indexOf('=');
      if (i > 0) { o[line.slice(0, i).trim()] = line.slice(i + 1).trim(); }
    });
    return o;
  }

  function render(s) {
    var on = s.run === '1';
    dot.className = 'dot' + (on ? ' on' : '');
    runText.textContent = on ? '运行中' : '未运行';
    ver.textContent = s.ver ? 'v' + s.ver : '';
    node.textContent = s.node || '未生成';
    var t = s.token || '';
    var unset = !t || t === '0';
    token.textContent = unset ? '未配置' : (s.token_masked || t);
    token.className = 'v mono' + (unset ? ' warn' : '');
    sb.textContent = (s.sb ? s.sb : '—') + (s.sb ? ' Mbps' : '');
    pid.textContent = s.pid || '—';
    autoEl.checked = s.autostart !== '0';
    rules.textContent = (s.rules || '0') + ' 条本地规则';
  }

  var loading = false;
  function refresh() {
    if (loading) { return Promise.resolve(false); }
    loading = true;
    return o2p('state').then(function (r) {
      loading = false;
      if (r.code !== 0) {
        runText.textContent = '读取失败';
        rules.textContent = '';
        var why = ((r.out || '') + '\n' + (r.err || '')).replace(/\r/g, '').trim();
        // 状态读不出来时顺手探一下环境，省得来回猜
        return sh(PROBE).then(function (p) {
          var extra = ((p.out || '') + (p.err || '')).replace(/\r/g, '').trim();
          logEl.className = '';
          logEl.textContent = '状态读取失败（退出码 ' + r.code + '）\n' +
            (why ? why + '\n\n' : '') + '—— 环境探测 ——\n' + (extra || '（探测器也没有输出，可能 root 权限没给到 WebUI）');
          return false;
        });
      }
      render(parseState(r.out));
      return true;
    });
  }

  function loadLog() {
    logEl.className = 'empty';
    logEl.textContent = '读取中…';
    return o2p('log 200').then(function (r) {
      var text = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      logEl.className = text ? '' : 'empty';
      logEl.textContent = text || '还没有日志，服务启动后这里会出现输出';
      logEl.scrollTop = logEl.scrollHeight;
    });
  }

  var running = false;
  function act(sub, label) {
    if (running) { return Promise.resolve(); }
    running = true;
    setDisabled(true);
    showBusy(label + '…');
    return o2p(sub).then(function (r) {
      var out = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      return refresh().then(function () {
        running = false;
        setDisabled(false);
        showBusy('');
        var msg = out.split('\n').pop() || (r.code === 0 ? '完成' : '失败（退出码 ' + r.code + '）');
        toast(label + '：' + msg);
        if (r.code === 0) { return loadLog(); }
        logEl.className = out ? '' : 'empty';
        logEl.textContent = out || label + '失败（退出码 ' + r.code + '，没有输出）';
      });
    });
  }

  function setDisabled(v) {
    ['save', 'start', 'stop', 'restart', 'refresh', 'reload', 'diag', 'export', 'auto'].forEach(function (id) {
      $(id).disabled = v;
    });
  }

  $('save').addEventListener('click', function () {
    var v = tk.value.trim();
    if (!v) { toast('先填 token'); return; }
    if (!/^\d+$/.test(v)) { toast('token 是纯数字'); return; }
    act('token ' + v, '保存 token').then(function () { tk.value = ''; });
  });

  $('start').addEventListener('click', function () { act('start', '启动'); });
  $('stop').addEventListener('click', function () { act('stop', '停止'); });
  $('restart').addEventListener('click', function () { act('restart', '重启'); });
  $('refresh').addEventListener('click', function () { refresh().then(function (ok) { if (ok) { loadLog(); } }); });
  $('reload').addEventListener('click', loadLog);

  // 开机自启开关：直接切配置文件里的状态，不需要重启
  autoEl.addEventListener('change', function () {
    var on = autoEl.checked;
    if (running) { autoEl.checked = !on; return; }
    act('autostart ' + (on ? 'on' : 'off'), '开机自启');
  });

  // 诊断：环境、进程、DNS、最近日志一次性打出来
  $('diag').addEventListener('click', function () {
    if (running) { return; }
    running = true;
    setDisabled(true);
    showBusy('诊断中…');
    o2p('diag').then(function (r) {
      running = false;
      setDisabled(false);
      showBusy('');
      var text = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      logEl.className = text ? '' : 'empty';
      logEl.textContent = text || '诊断没有输出（退出码 ' + r.code + '）';
      logEl.scrollTop = 0;
    });
  });

  // 导出：写到 /sdcard/Download，路径用 toast 告诉用户
  $('export').addEventListener('click', function () {
    if (running) { return; }
    running = true;
    setDisabled(true);
    showBusy('导出中…');
    o2p('export').then(function (r) {
      running = false;
      setDisabled(false);
      showBusy('');
      var text = ((r.out || '') + (r.err || '')).replace(/\r/g, '').trim();
      var line = text.split('\n').pop();
      toast(line || ('导出失败（退出码 ' + r.code + '）'));
      logEl.className = text ? '' : 'empty';
      logEl.textContent = text || '导出没有输出（退出码 ' + r.code + '）';
      logEl.scrollTop = 0;
    });
  });

  $('mgmt').addEventListener('click', function () {
    // ksu_download 暴露 openExternal（系统浏览器打开）；老版本管理器退回 am start
    try {
      if (window.ksu_download && window.ksu_download.openExternal) {
        window.ksu_download.openExternal(MGMT);
        return;
      }
    } catch (e) {}
    sh('/system/bin/am start --user 0 -a android.intent.action.VIEW -d "' + MGMT + '"').then(function (r) {
      if (r.code !== 0) { toast('打不开浏览器：' + (r.err || r.out || r.code)); }
    });
  });

  refresh().then(function (ok) { if (ok) { loadLog(); } });
})();
</script>
</body>
</html>
